[package]
name = "avb-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable AVB metadata walking, authentication and embedded ABL key discovery"

[features]
default = ["std", "digest", "verify"]
# `std` only adds `std::error::Error` implementations for the crate's error
# types; everything else is `no_std` + `alloc`.
std = []
# `digest` pulls in `sha2`: the SHA-256/SHA-512 used for descriptor key digests,
# `androidboot.vbmeta.digest` and the authentication hash. Without it the crate
# parses headers, typed descriptors and footers with no dependency at all.
digest = ["dep:sha2"]
# `verify` uses in-crate fixed-width RSA PKCS#1 v1.5 verification and enables
# the whole walk (`Plan`): it exists only to judge an image against a key, so it
# cannot exist without verification. Substitution policy (when to serve a stored
# image instead of an on-slot one) is a consumer's job, not this crate's:
# ablwrap's `ablwrap-resolve` crate is built on these primitives. `abl_keys` is
# deliberately **not** gated: its `rr == 2^(2*bits)
# mod n` self-consistency check is computed in-crate, so the key scan stays
# dependency-free.
verify = ["digest"]
# `api` adds the flat, owned projection of this crate for binding generators
# (`avb_meta::api`): plain structs, no lifetimes, no serde, no new dependencies.
# It needs `verify`, because the walk it projects cannot exist without signature
# verification.
api = ["verify"]

[dependencies]
avb-graft = { path = "../avb-graft" }
sha2 = { version = "0.10.9", default-features = false, optional = true }

[dev-dependencies]
num-bigint = { version = "0.4.6", default-features = false }

[[test]]
name = "plan"
required-features = ["verify"]
