[workspace]
resolver = "3"
members = [
    "crates/avb-chain",
    "crates/avb-format",
    "crates/avb-graft",
    "crates/avb-image",
    "crates/avb-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
num-bigint = { version = "0.4.6", default-features = false }
sha2 = { version = "0.10.9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
